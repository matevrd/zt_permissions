services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  matevrd\ZtPermissions\:
    resource: "../Classes/"
    exclude:
      - "../Classes/Domain/Model/*"

  matevrd\ZtPermissions\Command\DebugPermissionsCommand:
    tags:
      - name: console.command
        command: "zt-permissions:debug-permissions"
        description: "Zeigt die effektiven Rechte und Risikotreffer eines Backend-Benutzers"
        schedulable: false

  matevrd\ZtPermissions\Hooks\SecurityCriticalActionHook:
    public: true
